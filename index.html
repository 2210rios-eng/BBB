<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>水蘊草 AR 觀察</title>
  <!-- 引入 A-Frame 與 MindAR 專用函式庫 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  
  <a-scene 
    mindar-image="imageTargetSrc: ./aa.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- 對應你的 3D 模型檔案 aquarium.glb -->
      <a-asset-item id="plantModel" src="./aquarium.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 綁定第一張辨識圖 (targetIndex: 0) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- 載入 3D 模型，可透過 scale 調整大小 -->
      <a-gltf-model 
        src="#plantModel" 
        position="0 0 -10" 
        scale="0.02 0.02 0.02" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>
    
  </a-scene>

</body>
</html>
